name: Build Mobile Apps (Debug)

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phone:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Phone debug APK
        run: gradle :app:assembleDebug -Ppixelplay.enableAbiSplits=true

      - name: Verify ARM64 Phone APK
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          apk=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"

      - name: Upload Phone split APK artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PixelPlay-phone-debug-split-apks
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          compression-level: 0

  build-iphone:
    name: Build iPhone simulator app
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build VYBE for iPhone Simulator
        run: |
          xcodebuild build \
            -project iosApp/VYBE.xcodeproj \
            -scheme VYBE \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Package iPhone simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-derived/Build/Products/Debug-iphonesimulator/VYBE.app \
            build/VYBE-iPhone-Simulator.zip

      - name: Upload iPhone simulator artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VYBE-iPhone-Simulator
          path: build/VYBE-iPhone-Simulator.zip
          if-no-files-found: error
          compression-level: 0
