name: Mobile Release (Android + iPhone)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.11.9)
        required: false
        default: 'v0.11.9'
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}-${{ inputs.tag || 'tag' }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.11.9' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android release signing key
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Using repository Android release signing secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ci-release.jks
            {
              echo "storeFile=ci-release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > keystore.properties
          else
            echo "No Android keystore secrets found, generating CI release signing key..."
            keytool -genkey -v -keystore ci-release.jks -alias vybe-release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "vybe-release-pass" -keypass "vybe-release-pass" \
              -dname "CN=VYBE, OU=Mobile, O=VYBE, L=World, S=World, C=US"
            {
              echo "storeFile=ci-release.jks"
              echo "storePassword=vybe-release-pass"
              echo "keyAlias=vybe-release"
              echo "keyPassword=vybe-release-pass"
            } > keystore.properties
          fi

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          RAW_TAG="${RELEASE_TAG}"
          VERSION="${RAW_TAG#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          PROP_CODE=$(grep "^APP_VERSION_CODE=" gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          CALC_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          FINAL_CODE=${PROP_CODE:-$CALC_CODE}
          if (( FINAL_CODE < 11500 )); then FINAL_CODE=11500; fi
          echo "code=$FINAL_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved Android version: $VERSION with monotonic versionCode: $FINAL_CODE"

      - name: Build signed Android release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -Ppixelplay.enableAbiSplits=true \
            -PAPP_VERSION_NAME=${{ steps.version.outputs.value }} \
            -PAPP_VERSION_CODE=${{ steps.version.outputs.code }} \
            --no-daemon

      - name: Verify signed Android APKs
        shell: bash
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          mkdir -p release/android
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*-release.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one modern ARM64 release APK." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
            case "$apk" in
              *arm64-v8a*) ABI="arm64-v8a" ;;
              *) echo "Unknown APK ABI: $apk" >&2; exit 1 ;;
            esac
            cp "$apk" "release/android/VYBE-Android-${{ steps.version.outputs.value }}-${ABI}.apk"
          done

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vybe-android-${{ steps.version.outputs.value }}
          path: release/android/*.apk
          if-no-files-found: error
          compression-level: 0

  ios:
    name: iPhone IPA
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.11.7' }}
      P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Apple signing credentials
        id: check_signing
        shell: bash
        run: |
          if [[ -n "$P12_BASE64" && -n "$P12_PASSWORD" && -n "$PROFILE_BASE64" && -n "$APPLE_TEAM_ID" ]]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets not provided in repo. Building sideloadable IPA (AltStore, TrollStore, SideStore, Scarlet compatible)."
          fi

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          RAW_TAG="${RELEASE_TAG}"
          VERSION="${RAW_TAG#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          PROP_CODE=$(grep "^APP_VERSION_CODE=" gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          CALC_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          FINAL_CODE=${PROP_CODE:-$CALC_CODE}
          if (( FINAL_CODE < 11500 )); then FINAL_CODE=11500; fi
          echo "code=$FINAL_CODE" >> "$GITHUB_OUTPUT"

      - name: Install temporary Apple signing identity (if credentials provided)
        if: steps.check_signing.outputs.has_signing == 'true'
        id: signing
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/vybe-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/vybe.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/vybe-signing.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "vybe-ci" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "vybe-ci" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "vybe-ci" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile-name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "keychain-path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Build & Archive VYBE for iPhone
        working-directory: iosApp
        shell: bash
        run: |
          if [[ "${{ steps.check_signing.outputs.has_signing }}" == "true" ]]; then
            xcodebuild archive \
              -project VYBE.xcodeproj \
              -scheme VYBE \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/VYBE.xcarchive" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY='Apple Distribution' \
              PROVISIONING_PROFILE_SPECIFIER='${{ steps.signing.outputs.profile-name }}' \
              MARKETING_VERSION='${{ steps.version.outputs.value }}' \
              CURRENT_PROJECT_VERSION='${{ steps.version.outputs.code }}'
          else
            xcodebuild archive \
              -project VYBE.xcodeproj \
              -scheme VYBE \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/VYBE.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              MARKETING_VERSION='${{ steps.version.outputs.value }}' \
              CURRENT_PROJECT_VERSION='${{ steps.version.outputs.code }}'
          fi

      - name: Export & Package IPA
        shell: bash
        run: |
          mkdir -p release/ios
          if [[ "${{ steps.check_signing.outputs.has_signing }}" == "true" ]]; then
            EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
            /usr/bin/plutil -create xml1 "$EXPORT_OPTIONS"
            /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
            /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
            /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
            /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$EXPORT_OPTIONS"
            /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.vybe.musicplayer string '${{ steps.signing.outputs.profile-name }}'" "$EXPORT_OPTIONS"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/VYBE.xcarchive" \
              -exportPath "$RUNNER_TEMP/VYBE-export" \
              -exportOptionsPlist "$EXPORT_OPTIONS"
            cp "$RUNNER_TEMP/VYBE-export/"*.ipa "release/ios/VYBE-iOS-${{ steps.version.outputs.value }}.ipa"
          else
            echo "Packaging sideloadable IPA from .app bundle..."
            mkdir -p "$RUNNER_TEMP/Payload"
            cp -r "$RUNNER_TEMP/VYBE.xcarchive/Products/Applications/VYBE.app" "$RUNNER_TEMP/Payload/"
            (cd "$RUNNER_TEMP" && zip -r -q "VYBE-iOS-${{ steps.version.outputs.value }}.ipa" Payload)
            cp "$RUNNER_TEMP/VYBE-iOS-${{ steps.version.outputs.value }}.ipa" "release/ios/"
          fi

      - name: Upload iPhone release artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vybe-ios-${{ steps.version.outputs.value }}
          path: release/ios/*.ipa
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.11.7' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all mobile artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "VYBE $RELEASE_TAG" \
              --generate-notes
          fi
